# Kanagatly VMS — offline-installable Docker appliance.
#
# Stack (post-MediaMTX):
#   go2rtc-init  one-shot: renders the runtime go2rtc.yaml (WebRTC ICE candidates
#                for THIS host) from go2rtc.base.yaml into the shared config volume.
#   go2rtc       live-media relay: API/WS :1984, WebRTC :8556 (buffered MSE + WebRTC).
#   backend      FastAPI/uvicorn :8000 — auth, inventory, playback, go2rtc sync.
#   caddy        TLS ingress :8443 — one secure origin (SPA + /api + /go2rtc).
#   postgres     OPTIONAL (profile "postgres"); default DB is SQLite on a volume.
#
# Publish only what a browser/desktop client connects to: :8443 (Caddy) and
# :8556 tcp+udp (go2rtc WebRTC media). Backend :8000 and go2rtc :1984 stay
# internal (reached through Caddy).
#
# Secrets come from .env (install.sh generates them). ${VAR:?} fails fast if unset.
#
# WebRTC/IP note: go2rtc must advertise the HOST's LAN IP as its ICE candidate,
# which a bridged container can't self-detect — so install.sh writes
# GO2RTC_WEBRTC_CANDIDATES=<host-ip>:8556 into .env and the renderer injects it.
# On Linux you can additionally give go2rtc the host network for cleaner ICE:
# see docker-compose.hostnet.yml (overlay) + deploy/docker/README.md. MSE works
# everywhere via the :8443 proxy regardless.

x-common-env: &common-env
  # Shared knobs the renderer + backend both read.
  GO2RTC_WEBRTC_CANDIDATES: ${GO2RTC_WEBRTC_CANDIDATES:-}
  GO2RTC_WEBRTC_PORT: ${GO2RTC_WEBRTC_PORT:-8556}

services:
  # ── One-shot: render runtime go2rtc.yaml (candidates for this host) ─────────
  # Reuses the image built by the `backend` service (NO own build: — two services
  # building the same tag makes buildx-bake collide with "image already exists").
  go2rtc-init:
    image: kanagatly/backend:latest
    environment:
      <<: *common-env
      # The renderer only needs the candidate env; DEBUG=true skips the backend's
      # production secret guard (no secrets required just to render YAML).
      DEBUG: "true"
    volumes:
      - go2rtc_config:/config
      - ./go2rtc.base.yaml:/base/go2rtc.base.yaml:ro
    command: >
      python -m app.services.go2rtc_config
      --base /base/go2rtc.base.yaml
      --out /config/go2rtc.yaml
    restart: "no"

  # ── Live-media relay ────────────────────────────────────────────────────────
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    restart: unless-stopped
    depends_on:
      go2rtc-init:
        condition: service_completed_successfully
    command: ["-config", "/config/go2rtc.yaml"]
    volumes:
      - go2rtc_config:/config
    ports:
      - "${GO2RTC_WEBRTC_PORT:-8556}:8556/tcp"   # WebRTC media (browser → host IP)
      - "${GO2RTC_WEBRTC_PORT:-8556}:8556/udp"   # WebRTC ICE/UDP

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kanagatly/backend:latest
    restart: unless-stopped
    depends_on:
      go2rtc:
        condition: service_started
    environment:
      <<: *common-env
      DEBUG: "false"
      # SQLite by default (zero extra services). Postgres: set DATABASE_URL and
      # start with `--profile postgres` (see the postgres service below).
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/dss.db}
      # Security — required; install.sh generates these into .env.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (install.sh generates it)}
      NVR_SECRET_KEY: ${NVR_SECRET_KEY:?set NVR_SECRET_KEY in .env (Fernet key)}
      # go2rtc wiring (internal DNS; browser never sees these).
      GO2RTC_API_URL: http://go2rtc:1984
      GO2RTC_WS_URL: ws://go2rtc:1984
      GO2RTC_CONFIG_PATH: /config/go2rtc.yaml
      # Generic-appliance default: go2rtc pulls mains natively via its HTTP API
      # (no per-host ffmpeg re-encode / process-restart plumbing). Firms whose
      # cameras need the anti-freeze re-encode can opt in — see README.
      MAIN_STREAM_MODE: ${MAIN_STREAM_MODE:-native}
      REENCODE_ENABLED: ${REENCODE_ENABLED:-false}
      REENCODE_FFMPEG_BIN: ffmpeg
      # NVR clock offset (minutes east of UTC) for recorded-playback timestamps.
      PLAYBACK_TZ_OFFSET_MINUTES: ${PLAYBACK_TZ_OFFSET_MINUTES:-0}
      LOG_FILE: /data/logs/backend.log
      # Behind Caddy everything is same-origin; keep localhost for direct-port dev.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
    volumes:
      - backend_data:/data                 # SQLite DB + logs
      - go2rtc_config:/config              # shared rendered config (read; write if reencode)
      - backend_licensing:/app/licensing   # operator-dropped public_key.pem + *.lic
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ── TLS ingress (SPA + reverse proxy) ───────────────────────────────────────
  caddy:
    build:
      context: .
      dockerfile: deploy/docker/caddy.Dockerfile
    image: kanagatly/caddy:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      CADDY_HTTPS_PORT: "8443"
      BACKEND_UPSTREAM: backend:8000
      GO2RTC_UPSTREAM: go2rtc:1984
    ports:
      - "${CADDY_HTTPS_PORT:-8443}:8443"
    volumes:
      - caddy_data:/data     # local CA + issued self-signed cert (persist across restarts)
      - caddy_config:/config

  # ── OPTIONAL Postgres (profile "postgres") ──────────────────────────────────
  # Default is SQLite (no extra moving parts). To use Postgres:
  #   set in .env → DATABASE_URL=postgresql+asyncpg://dss:PASS@postgres:5432/dss
  #   then:        docker compose --profile postgres up -d
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dss}
      POSTGRES_DB: ${POSTGRES_DB:-dss}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dss} -d ${POSTGRES_DB:-dss}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  backend_data:
  backend_licensing:
  go2rtc_config:
  caddy_data:
  caddy_config:
  pgdata:
