<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Kanagatly VMS app icon — #2ecc71 green disc with bold white "KM",
       matching the web app's LogoMark. -->
  <defs>
    <radialGradient id="g" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#43e088"/>
      <stop offset="55%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#22b864"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="0" fill="#0a0d10"/>
  <circle cx="256" cy="256" r="216" fill="url(#g)"/>
  <text x="256" y="262" dominant-baseline="central" text-anchor="middle"
        font-family="Manrope, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="200" font-weight="800" fill="#ffffff" letter-spacing="-10">KM</text>
</svg>
