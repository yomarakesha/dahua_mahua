<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Kanagatly VMS</title>
  <link rel="stylesheet" href="./connect.css" />
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg class="logo" width="56" height="56" viewBox="0 0 100 100" aria-label="Kanagatly VMS">
        <circle cx="50" cy="50" r="50" fill="#2ecc71" />
        <text x="50" y="50" dominant-baseline="central" text-anchor="middle"
              font-family="system-ui, sans-serif" font-size="42" font-weight="800"
              fill="#fff" letter-spacing="-2">KM</text>
      </svg>
      <div class="wordmark">Kanagatly <span class="accent">VMS</span></div>
    </div>

    <h1>Connect to your VMS server</h1>
    <p class="sub">Enter the address of your Kanagatly VMS. This is the HTTPS URL served by the on-site appliance.</p>

    <form id="form" autocomplete="off">
      <label for="url">Server URL</label>
      <input id="url" name="url" type="text" spellcheck="false"
             placeholder="https://10.10.1.152:8443" />
      <div id="msg" class="msg" role="alert"></div>

      <div id="recentWrap" class="recent" hidden>
        <div class="recent-label">Recent</div>
        <div id="recentList"></div>
      </div>

      <button id="connect" type="submit">Connect</button>
    </form>

    <div class="foot">
      Self-signed certificates from the server you enter are trusted automatically.
    </div>
  </main>

  <script src="./connect.js"></script>
</body>
</html>
